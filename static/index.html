<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 訂單助理</title>
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --me: #2563eb; --me-text: #ffffff; --bot: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --panel: #292524; --text: #f5f5f4; --muted: #a8a29e;
      --border: #44403c; --me: #3b82f6; --me-text: #ffffff; --bot: #1c1917;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    height: 100dvh; display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 960px; display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--me); color: var(--me-text); border-color: var(--me); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
  .sys { align-self: center; color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  textarea { flex: 1; font: inherit; resize: none; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); height: 64px; }
  #order { padding: 16px; overflow-y: auto; font-size: 14px; }
  #order .empty { color: var(--muted); }
  #order dl { margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; }
  #order dt { color: var(--muted); }
  #order dd { margin: 0; }
  #order ul { padding-left: 18px; margin: 0; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; padding: 8px 16px; }
    #orderPanel { max-height: 30dvh; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="panel">
    <header>
      <h1>AI 訂單助理</h1>
      <span style="display:flex;gap:8px;align-items:center">
        <a href="/products" style="color:var(--me);font-size:14px">商品總覽</a>
        <a href="/orders" style="color:var(--me);font-size:14px">訂單列表</a>
        <button id="reset" type="button">重新開始</button>
      </span>
    </header>
    <div id="log"><div class="msg sys">可以直接貼上整段訂單，例如：冰糖2包 豆腐乳5箱，週五前送到</div></div>
    <form id="form">
      <textarea id="input" placeholder="輸入訊息（Enter 送出，Shift+Enter 換行）"></textarea>
      <button class="primary" id="send">送出</button>
    </form>
  </section>
  <aside class="panel" id="orderPanel">
    <header><h1>目前訂單</h1></header>
    <div id="order"><div class="empty">尚未成立</div></div>
  </aside>
</div>
<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function storage(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
    } catch { return null; }
  }
  // 每次開頁面都是新對話；畫面上看不到舊訊息，伺服器那邊也不該接著舊的講
  let sessionId = crypto.randomUUID();
  let token = storage("accessToken") || "";

  function add(cls, text) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function renderOrder(order, id) {
    const box = document.getElementById("order");
    box.replaceChildren();
    if (!order) { box.innerHTML = '<div class="empty">尚未成立</div>'; return; }
    const dl = document.createElement("dl");
    [["編號", id], ["客戶", order.CustomerName], ["收貨人", order.ReceiverName],
     ["地址", order.DeliveryAddress], ["到貨日", order.DeliveryDate], ["備註", order.Remarks]]
      .filter(([, v]) => v)
      .forEach(([k, v]) => {
        const dt = document.createElement("dt"); dt.textContent = k;
        const dd = document.createElement("dd"); dd.textContent = v;
        dl.append(dt, dd);
      });
    const ul = document.createElement("ul");
    order.Items.forEach(i => {
      const li = document.createElement("li");
      li.textContent = `${i.ProductName}（${i.ProductNo}）× ${i.Quantity} ${i.Unit || ""}`;
      ul.appendChild(li);
    });
    box.append(dl, ul);
  }

  async function call(path, body) {
    for (;;) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Access-Token": token },
        body: JSON.stringify(body),
      });
      if (res.status === 401) {
        token = prompt("請輸入通關碼") || "";
        storage("accessToken", token);
        if (!token) throw new Error("需要通關碼");
        continue;
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "發生錯誤");
      return data;
    }
  }

  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("me", text);
    send.disabled = true;
    const waiting = add("sys", "思考中…");
    try {
      const data = await call("/api/chat", { session_id: sessionId, message: text });
      waiting.remove();
      add("bot", data.reply);
      renderOrder(data.order, data.order_id);
    } catch (err) {
      waiting.textContent = err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      document.getElementById("form").requestSubmit();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    try { await call("/api/reset", { session_id: sessionId }); } catch {}
    sessionId = crypto.randomUUID();
    log.replaceChildren();
    add("sys", "對話已重置");
    renderOrder(null);
  });
</script>
</body>
</html>
